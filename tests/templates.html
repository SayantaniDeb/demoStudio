<!doctype html>
<html>
  <body>
    <h1>Storyboard preview checks</h1>
    <pre id="result">Running…</pre>
    <div id="previews"></div>
    <script type="module">
      import { renderTemplate, demoTemplates, templateChapters } from '/src/demoTemplates.ts';
      const data = {
        url: 'https://example.com',
        brand: 'Example',
        title: 'A better way to plan',
        description: 'Create a clear plan for your next adventure.',
        cta: 'Get started',
        accent: '#526de6',
        sections: [
          { title: 'Plan your journey', body: 'Organize your next trip.' },
          { title: 'Keep everything together', body: 'Save your favorite places.' },
          { title: 'Share with friends', body: 'Make plans together.' },
        ],
        capturedAt: '',
        motion: { assets: [], catalog: [] },
      };
      const copy = {
        brand: data.brand,
        query: data.title,
        filename: data.description,
        headline: data.cta,
        pointer: 'arrow',
        size: 28,
      };
      const hashes = [];
      for (const template of demoTemplates) {
        const c = document.createElement('canvas');
        c.width = 1280;
        c.height = 720;
        c.style.width = '480px';
        document.querySelector('#previews').append(c);
        const ctx = c.getContext('2d');
        renderTemplate(ctx, 12, copy, data, template.id);
        const pixels = ctx.getImageData(0, 0, 1280, 720).data;
        let hash = 0;
        for (let i = 0; i < pixels.length; i += 83) hash = (hash * 31 + pixels[i]) >>> 0;
        hashes.push(hash);
        if (templateChapters(template.id).length !== 6) throw Error('Missing chapters');
      }
      document.querySelector('#result').textContent =
        new Set(hashes).size === 3
          ? 'PASS three visually distinct storyboards, each with six scenes'
          : 'FAIL duplicate layouts';
    </script>
  </body>
</html>
