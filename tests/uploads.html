<!doctype html>
<html>
  <body>
    <h1>Uploaded media storyboard checks</h1>
    <pre id="result">Running…</pre>
    <script type="module">
      import { storyboardFromUpload } from '/src/uploadStoryboard.ts';
      import { prepareMotion } from '/src/cinematic.ts';
      import { renderTemplate, demoTemplates } from '/src/demoTemplates.ts';
      const output = document.querySelector('#result');
      try {
        const c = document.createElement('canvas');
        c.width = 640;
        c.height = 360;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#f3eee6';
        ctx.fillRect(0, 0, 640, 360);
        ctx.fillStyle = '#dd7044';
        ctx.fillRect(65, 60, 180, 220);
        ctx.fillStyle = '#52755a';
        ctx.fillRect(330, 80, 230, 160);
        const stream = c.captureStream(30),
          rec = new MediaRecorder(stream),
          chunks = [];
        const done = new Promise((resolve) => {
          rec.ondataavailable = (e) => chunks.push(e.data);
          rec.onstop = () => resolve(new Blob(chunks, { type: rec.mimeType }));
        });
        rec.start();
        await new Promise((resolve) => {
          const start = performance.now();
          const tick = () => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(350, 110, 160, 30);
            ctx.fillStyle = '#111111';
            ctx.font = '22px Arial';
            ctx.fillText(
              performance.now() - start > 1100 ? 'Export complete' : 'Upload file',
              355,
              134,
            );
            if (performance.now() - start > 2200) resolve();
            else requestAnimationFrame(tick);
          };
          tick();
        });
        await new Promise((resolve) => setTimeout(resolve, 350));
        rec.stop();
        const blob = await done,
          url = URL.createObjectURL(blob),
          checks = [];
        for (const kind of ['video', 'image']) {
          const data = await storyboardFromUpload(
            url,
            [{ id: 'a', start: 0.1, end: 0.6 }],
            'Uploaded test',
            kind,
            () => {},
          );
          if (
            kind === 'video' &&
            (data.analysis.duration < 2 ||
              data.analysis.samples < 3 ||
              !data.analysis.groups.some((g) => g.end > 1))
          )
            throw Error('Full source scan missed footage beyond editor cuts');
          if (
            !data.analysis.imageIndices.length ||
            !data.sections.some((s) => /Upload|Export/i.test(s.body))
          )
            throw Error('OCR or image composition missing');
          if (data.sourceType !== kind || data.motion.assets.length < 3 || !data.sections.length)
            throw Error(kind + ' extraction failed');
          if (kind === 'video')
            for (const i of data.analysis.imageIndices) {
              const image = new Image();
              image.src = data.motion.assets[i];
              image.style.width = 'min(100%, 960px)';
              image.alt = 'Composed image from recognized video content';
              document.body.append(image);
            }
          await prepareMotion(data);
          for (const template of demoTemplates) {
            const preview = document.createElement('canvas');
            preview.width = 1280;
            preview.height = 720;
            renderTemplate(
              preview.getContext('2d'),
              12,
              {
                brand: data.brand,
                query: data.title,
                filename: data.description,
                headline: data.cta,
                pointer: 'arrow',
                size: 28,
              },
              data,
              template.id,
            );
          }
          checks.push(
            'PASS ' + kind + ' source builds actual frame/crop assets and renders all three styles',
          );
        }
        stream.getTracks().forEach((t) => t.stop());
        URL.revokeObjectURL(url);
        output.textContent = checks.join('\n');
      } catch (e) {
        output.textContent = 'FAIL ' + e.message;
      }
    </script>
  </body>
</html>
