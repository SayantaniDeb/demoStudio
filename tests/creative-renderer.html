<!doctype html><html><head><title>Creative renderer verification</title><style>body{font:16px system-ui;background:#edf0e8;padding:24px;color:#263b22}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}canvas{width:100%;border-radius:14px;background:white}pre{white-space:pre-wrap}</style></head><body><h1>Vector renderer verification</h1><p>Three timestamps from a synthetic renderer test fixture, not an AI generation.</p><div class="frames"></div><pre id="result">Loading fixture…</pre><script type="module">
import {renderCreative,creativeSVG,componentPose} from '/src/creative.ts';
import {validateCreative} from '/shared/creative.mjs';
try{const plan=validateCreative(await (await fetch('/tests/fixtures/creative-renderer-fixture.json')).json());const scene=plan.scenes[0];const hashes=[];for(const t of [.15,scene.duration*.4,scene.duration*.8]){const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;document.querySelector('.frames').append(canvas);const ctx=canvas.getContext('2d');renderCreative(ctx,t,plan);const data=ctx.getImageData(0,0,1280,720).data;let hash=0;for(let i=0;i<data.length;i+=13)hash=(hash*31+data[i])>>>0;hashes.push(hash)}if(new Set(hashes).size<2)throw Error('Frames did not change');const svg=creativeSVG(plan,scene.duration*.4);const parsed=new DOMParser().parseFromString(svg,'image/svg+xml');if(parsed.querySelector('parsererror'))throw Error('SVG export failed parsing');document.querySelector('#result').textContent=`PASS: ${plan.scenes.length} test scenes; ${plan.scenes.flatMap(s=>s.components).length} component groups; distinct frame hashes ${hashes.join(', ')}; SVG parses successfully.`}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message}
</script></body></html>
