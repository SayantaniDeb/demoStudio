<!doctype html><html><body><h1>Zoom and built-in music checks</h1><pre id="result">Running…</pre><script type="module">
import {CursorReplacer,paintCursor} from '/src/cursor.ts';import {viewAt} from '/src/motion.ts';import {makeSoundtrack} from '/src/demoAudio.ts';
try{const points=[{time:0,x:50,y:50,strength:1},{time:1.8,x:75,y:30,strength:1},{time:2,x:75,y:30,strength:0}];const check=(value,message)=>{if(!value)throw Error(message)};
check(Math.abs(viewAt(points,1,true,1.03,50,50).zoom-1.03)<.001,'3% zoom in ignored');check(Math.abs(viewAt(points,1,true,.97,50,50).zoom-.97)<.001,'3% zoom out ignored');check(viewAt(points,3,true,1.5,50,50).zoom===1,'Idle zoom did not return to normal');
